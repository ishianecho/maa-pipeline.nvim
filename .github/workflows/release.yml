name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run stylecheck
      - run: pnpm test
      - run: pnpm run build
      - run: mkdir -p release && pnpm pack --pack-destination release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/maa-pipeline.nvim-*.tgz
